# Xcode project definition. The cloud build turns this into ScoreCount.xcodeproj with XcodeGen.
# To change the app's ID, edit SCORE_BUNDLE_PREFIX below (it must be unique to you).
name: ScoreCount
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SCORE_BUNDLE_PREFIX: com.scorepad.chowdvi
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  ScoreCount:
    type: application
    platform: iOS
    sources:
      - path: iOS
      # The same index.html that runs in the browser is bundled into the app, so there is one copy of the app to edit.
      - path: index.html
        buildPhase: resources
    info:
      path: Support/iOS-Info.plist
      properties:
        CFBundleDisplayName: Scorepad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SCORE_BUNDLE_PREFIX).scorecount"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme: {}
