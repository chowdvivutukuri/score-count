name: Build iPhone app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app (unsigned)
        run: |
          set +e
          xcodebuild \
            -project ScoreCount.xcodeproj \
            -scheme ScoreCount \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          grep -E "error:|BUILD" build.log | tail -40
          exit $code

      - name: Check the app bundles the scorepad page
        run: |
          APP=build/Build/Products/Release-iphoneos/ScoreCount.app
          test -f "$APP/index.html" || (echo "::error::index.html is missing from the app" && exit 1)

      - name: Ad-hoc sign (Sideloadly re-signs it)
        run: codesign -f -s - build/Build/Products/Release-iphoneos/ScoreCount.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScoreCount.app Payload/
          zip -qry Scorepad.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Scorepad-ipa
          path: Scorepad.ipa
          retention-days: 30

      - name: Publish to Releases (easy download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Scorepad.ipa \
            --title "Scorepad build ${{ github.run_number }}" \
            --notes "Download Scorepad.ipa below and install it with Sideloadly (see README)." \
            --latest

      - name: Report compile errors
        if: failure()
        run: |
          msg=$(grep -E "(error|fatal error):" build.log | sed 's#.*/score-count/##' | sort -u | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Compile errors::${msg:-no error lines found}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
